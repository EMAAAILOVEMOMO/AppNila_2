<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 620" role="img" aria-label="Teléfono móvil con módulos de código, sensores y notificaciones">
  <defs>
    <linearGradient id="scr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2330"/>
      <stop offset="1" stop-color="#10131a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d7ff4f"/>
      <stop offset="1" stop-color="#ff5a36"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>

  <!-- halo -->
  <circle cx="260" cy="310" r="236" fill="none" stroke="#2b3243" stroke-width="1.5" stroke-dasharray="3 9"/>
  <circle cx="260" cy="310" r="176" fill="none" stroke="#2b3243" stroke-width="1.5"/>
  <circle cx="260" cy="310" r="120" fill="#ff5a36" opacity=".10"/>

  <!-- phone body -->
  <g filter="url(#soft)">
    <rect x="150" y="62" width="220" height="460" rx="38" fill="#0b0d12" stroke="#3a4257" stroke-width="3"/>
    <rect x="162" y="74" width="196" height="436" rx="28" fill="url(#scr)"/>
    <rect x="228" y="84" width="64" height="16" rx="8" fill="#0b0d12"/>
  </g>

  <!-- screen: status line -->
  <text x="182" y="124" font-family="monospace" font-size="11" fill="#7f8aa3">09:41</text>
  <g fill="#7f8aa3">
    <rect x="316" y="115" width="4" height="8" rx="1"/>
    <rect x="322" y="112" width="4" height="11" rx="1"/>
    <rect x="328" y="109" width="4" height="14" rx="1"/>
    <rect x="336" y="110" width="16" height="12" rx="3" fill="none" stroke="#7f8aa3" stroke-width="1.5"/>
    <rect x="338" y="112" width="9" height="8" rx="1.5"/>
  </g>

  <!-- screen: code card -->
  <rect x="180" y="146" width="160" height="104" rx="14" fill="#161b26" stroke="#2b3243"/>
  <circle cx="196" cy="162" r="3.5" fill="#ff5a36"/>
  <circle cx="208" cy="162" r="3.5" fill="#d7ff4f"/>
  <circle cx="220" cy="162" r="3.5" fill="#6fd3ff"/>
  <g font-family="monospace" font-size="10.5">
    <text x="194" y="186" fill="#ff5a36">fun</text>
    <text x="216" y="186" fill="#e9e4d8">onResume() {</text>
    <text x="204" y="204" fill="#6fd3ff">sensorManager</text>
    <text x="204" y="220" fill="#7f8aa3">  .register(...)</text>
    <text x="194" y="236" fill="#e9e4d8">}</text>
  </g>

  <!-- screen: sensor wave -->
  <rect x="180" y="262" width="160" height="74" rx="14" fill="#161b26" stroke="#2b3243"/>
  <path d="M192 304 C 204 274, 214 274, 224 304 S 244 334, 256 304 S 276 274, 288 304 S 308 334, 328 296"
        fill="none" stroke="url(#glow)" stroke-width="3" stroke-linecap="round"/>
  <text x="192" y="278" font-family="monospace" font-size="9.5" fill="#7f8aa3">acelerómetro · x y z</text>

  <!-- screen: list rows -->
  <rect x="180" y="348" width="160" height="38" rx="12" fill="#161b26" stroke="#2b3243"/>
  <rect x="192" y="360" width="14" height="14" rx="4" fill="#d7ff4f"/>
  <rect x="214" y="361" width="82" height="5" rx="2.5" fill="#e9e4d8" opacity=".85"/>
  <rect x="214" y="370" width="56" height="4" rx="2" fill="#7f8aa3"/>
  <rect x="180" y="396" width="160" height="38" rx="12" fill="#161b26" stroke="#2b3243"/>
  <rect x="192" y="408" width="14" height="14" rx="4" fill="#6fd3ff"/>
  <rect x="214" y="409" width="70" height="5" rx="2.5" fill="#e9e4d8" opacity=".85"/>
  <rect x="214" y="418" width="94" height="4" rx="2" fill="#7f8aa3"/>

  <!-- screen: bottom nav -->
  <rect x="180" y="454" width="160" height="40" rx="20" fill="#0b0d12" stroke="#2b3243"/>
  <circle cx="212" cy="474" r="7" fill="#ff5a36"/>
  <circle cx="260" cy="474" r="5" fill="#3a4257"/>
  <circle cx="308" cy="474" r="5" fill="#3a4257"/>

  <!-- floating chips -->
  <g transform="rotate(-6 96 150)">
    <rect x="30" y="122" width="128" height="52" rx="14" fill="#d7ff4f"/>
    <text x="48" y="144" font-family="monospace" font-size="10" fill="#14171f" opacity=".7">git commit</text>
    <text x="48" y="162" font-family="monospace" font-size="13" font-weight="700" fill="#14171f">v1.4.0 ✓</text>
  </g>

  <g transform="rotate(5 430 232)">
    <rect x="366" y="204" width="134" height="54" rx="14" fill="#f4efe6"/>
    <circle cx="388" cy="231" r="9" fill="#ff5a36"/>
    <rect x="404" y="220" width="70" height="6" rx="3" fill="#14171f"/>
    <rect x="404" y="232" width="48" height="5" rx="2.5" fill="#14171f" opacity=".45"/>
    <text x="404" y="250" font-family="monospace" font-size="8.5" fill="#14171f" opacity=".6">notificación</text>
  </g>

  <g transform="rotate(-4 92 400)">
    <rect x="24" y="368" width="132" height="62" rx="14" fill="#161b26" stroke="#3a4257"/>
    <ellipse cx="62" cy="388" rx="22" ry="7" fill="none" stroke="#6fd3ff" stroke-width="2"/>
    <path d="M40 388 v22 c0 4 10 8 22 8 s22 -4 22 -8 v-22" fill="none" stroke="#6fd3ff" stroke-width="2"/>
    <path d="M40 399 c0 4 10 8 22 8 s22 -4 22 -8" fill="none" stroke="#6fd3ff" stroke-width="2"/>
    <text x="96" y="402" font-family="monospace" font-size="11" fill="#e9e4d8">SQLite</text>
    <text x="96" y="416" font-family="monospace" font-size="9" fill="#7f8aa3">Room</text>
  </g>

  <g transform="rotate(6 428 440)">
    <rect x="372" y="414" width="118" height="50" rx="25" fill="none" stroke="#ff5a36" stroke-width="2.5"/>
    <polygon points="396,428 396,450 414,439" fill="#ff5a36"/>
    <rect x="426" y="434" width="48" height="5" rx="2.5" fill="#f4efe6" opacity=".8"/>
    <rect x="426" y="444" width="30" height="4" rx="2" fill="#7f8aa3"/>
  </g>

  <!-- tiny sparks -->
  <g fill="#d7ff4f">
    <circle cx="452" cy="104" r="4"/>
    <circle cx="70" cy="60" r="3"/>
    <circle cx="468" cy="560" r="3"/>
  </g>
  <g stroke="#ff5a36" stroke-width="2.5" stroke-linecap="round">
    <path d="M60 520 l12 0 M66 514 l0 12"/>
    <path d="M440 70 l10 0 M445 65 l0 10"/>
  </g>
</svg>
